<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IsyShell Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --accent: #4f8ef7;
    --accent-hover: #3a7de0;
    --success: #3ecf8e;
    --error: #f76e6e;
    --warn: #f7c948;
    --text: #e1e4f0;
    --muted: #6b7080;
    --mono: 'Courier New', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 { font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  header span { color: var(--muted); font-size: 12px; }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    transition: background .3s;
    margin-left: auto;
  }
  .status-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .status-dot.offline { background: var(--error); }

  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-rows: auto 1fr;
    gap: 0;
    height: calc(100vh - 52px);
  }

  .sidebar {
    grid-row: 1 / 3;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .auth-box {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .auth-box label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }

  .token-row { display: flex; gap: 6px; }

  input[type="password"], input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--accent); }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .2s, opacity .2s;
    white-space: nowrap;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  button.secondary:hover { background: var(--border); }
  button.danger { background: #c0392b; }
  button.danger:hover { background: #a93226; }

  .scripts-header {
    padding: 12px 16px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .scripts-header h2 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }

  .scripts-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .scripts-list::-webkit-scrollbar { width: 4px; }
  .scripts-list::-webkit-scrollbar-track { background: transparent; }
  .scripts-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .script-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .script-card:hover { border-color: var(--accent); }
  .script-card.selected { border-color: var(--accent); background: rgba(79,142,247,.07); }

  .script-card-name { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .script-card-file { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
  .script-card-desc { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .badge.active { background: rgba(62,207,142,.15); color: var(--success); }
  .badge.inactive { background: rgba(247,110,110,.12); color: var(--error); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 13px;
  }

  .main-area {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .exec-panel {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .exec-panel h2 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 12px; }

  .exec-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }

  .exec-form .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
  .exec-form label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .exec-form input[type="text"] { min-width: 0; }

  .script-name-display {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
  }
  .script-name-display.selected { color: var(--text); font-style: normal; font-weight: 600; }

  .result-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    padding: 0 24px;
  }

  .tab {
    padding: 10px 16px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    transition: color .2s, border-color .2s;
    margin-bottom: -1px;
    user-select: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-content { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .tab-content.active { display: flex; }

  .output-box {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .output-box::-webkit-scrollbar { width: 4px; }
  .output-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .output-placeholder { color: var(--muted); font-style: italic; font-family: system-ui; font-size: 13px; }

  .result-meta {
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    background: var(--surface);
  }
  .meta-item { font-size: 12px; color: var(--muted); }
  .meta-item strong { color: var(--text); font-weight: 600; }
  .meta-item.ok strong { color: var(--success); }
  .meta-item.fail strong { color: var(--error); }

  .logs-toolbar {
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--surface);
    flex-wrap: wrap;
  }
  .logs-toolbar input[type="text"] { width: 160px; }
  .logs-toolbar select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }
  .logs-toolbar select:focus { border-color: var(--accent); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  th {
    text-align: left;
    padding: 8px 12px;
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
  }
  td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  tr:hover td { background: rgba(255,255,255,.02); }

  .log-stdout-preview {
    font-family: var(--mono);
    color: var(--muted);
    font-size: 11px;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    bottom: 20px; right: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    max-width: 320px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    z-index: 100;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .25s, transform .25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ok { border-left: 3px solid var(--success); }
  .toast.fail { border-left: 3px solid var(--error); }

  .scroll-table { flex: 1; overflow-y: auto; }
  .scroll-table::-webkit-scrollbar { width: 4px; }
  .scroll-table::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: auto; }
    .sidebar { grid-row: auto; border-right: none; border-bottom: 1px solid var(--border); max-height: 320px; }
  }
</style>
</head>
<body>

<header>
  <h1>IsyShell</h1>
  <span>Dashboard</span>
  <div class="status-dot" id="statusDot" title="Status da API"></div>
</header>

<div class="layout">

  <!-- Sidebar: token + lista de scripts -->
  <aside class="sidebar">
    <div class="auth-box">
      <label for="tokenInput">X-Isy-Token</label>
      <div class="token-row">
        <input type="password" id="tokenInput" placeholder="cole seu token aqui" autocomplete="off">
        <button class="secondary" id="btnLoad" title="Carregar scripts">Carregar</button>
      </div>
    </div>

    <div class="scripts-header">
      <h2>Scripts <span id="scriptCount"></span></h2>
      <button class="secondary" id="btnRefresh" style="padding:4px 8px;font-size:11px;" title="Recarregar lista">&#8635;</button>
    </div>

    <div class="scripts-list" id="scriptsList">
      <div class="empty-state">Informe o token e clique em <strong>Carregar</strong></div>
    </div>
  </aside>

  <!-- Main area -->
  <div class="main-area">

    <!-- Painel de execução -->
    <div class="exec-panel">
      <h2>Executar Script</h2>
      <div class="exec-form">
        <div class="field">
          <label>Script selecionado</label>
          <div class="script-name-display" id="selectedScriptDisplay">nenhum selecionado</div>
        </div>
        <div class="field">
          <label for="paramsInput">Parâmetros (separados por espaço)</label>
          <input type="text" id="paramsInput" placeholder="ex: --env prod --verbose">
        </div>
        <button id="btnExecute" disabled>&#9654; Executar</button>
      </div>
    </div>

    <!-- Tabs resultado / logs -->
    <div class="result-area">
      <div class="tabs">
        <div class="tab active" data-tab="output">Resultado</div>
        <div class="tab" data-tab="logs">Logs de Auditoria</div>
      </div>

      <!-- Tab: Resultado -->
      <div class="tab-content active" id="tab-output">
        <div class="result-meta" id="resultMeta" style="display:none"></div>
        <div class="output-box" id="outputBox">
          <span class="output-placeholder">Selecione um script na barra lateral e clique em Executar.</span>
        </div>
      </div>

      <!-- Tab: Logs -->
      <div class="tab-content" id="tab-logs">
        <div class="logs-toolbar">
          <input type="text" id="logFilterScript" placeholder="Filtrar por script">
          <select id="logFilterStatus">
            <option value="">Todos os status</option>
            <option value="success">success</option>
            <option value="error">error</option>
          </select>
          <button class="secondary" id="btnLoadLogs" style="padding:8px 12px;">&#8635; Recarregar</button>
        </div>
        <div class="scroll-table">
          <table id="logsTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Script</th>
                <th>Status</th>
                <th>Exit</th>
                <th>Params</th>
                <th>Saída</th>
                <th>Executado em</th>
              </tr>
            </thead>
            <tbody id="logsBody">
              <tr><td colspan="7" style="text-align:center;color:var(--muted);padding:32px">Carregue os logs acima</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:8000';

let selectedScript = null;
let currentToken = () => document.getElementById('tokenInput').value.trim();

// ── Utilidades ──────────────────────────────────────────────────────────────

function headers() {
  return { 'Content-Type': 'application/json', 'X-Isy-Token': currentToken() };
}

function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'toast'; }, 3500);
}

function setStatus(online) {
  const dot = document.getElementById('statusDot');
  dot.className = `status-dot ${online ? 'online' : 'offline'}`;
  dot.title = online ? 'API online' : 'API offline ou token inválido';
}

function parseParams(raw) {
  return raw.trim() ? raw.trim().split(/\s+/) : [];
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('pt-BR');
}

// ── Status da API ────────────────────────────────────────────────────────────

async function checkApiStatus() {
  try {
    const r = await fetch(`${API}/`, { signal: AbortSignal.timeout(3000) });
    setStatus(r.ok);
  } catch { setStatus(false); }
}

// ── Scripts ──────────────────────────────────────────────────────────────────

async function loadScripts() {
  const token = currentToken();
  if (!token) { toast('Informe o token antes de carregar.', 'fail'); return; }

  const list = document.getElementById('scriptsList');
  list.innerHTML = '<div class="empty-state"><span class="spinner"></span> Carregando…</div>';
  document.getElementById('btnRefresh').disabled = true;

  try {
    const r = await fetch(`${API}/api/v1/scripts/`, { headers: headers() });
    if (!r.ok) {
      const err = await r.json().catch(() => ({ detail: r.statusText }));
      throw new Error(err.detail || r.statusText);
    }
    const scripts = await r.json();
    setStatus(true);
    renderScripts(scripts);
  } catch (e) {
    setStatus(false);
    list.innerHTML = `<div class="empty-state" style="color:var(--error)">${escapeHtml(e.message)}</div>`;
    toast(e.message, 'fail');
  } finally {
    document.getElementById('btnRefresh').disabled = false;
  }
}

function renderScripts(scripts) {
  const list = document.getElementById('scriptsList');
  const count = document.getElementById('scriptCount');
  count.textContent = `(${scripts.length})`;

  if (!scripts.length) {
    list.innerHTML = '<div class="empty-state">Nenhum script cadastrado</div>';
    return;
  }

  list.innerHTML = '';
  scripts.forEach(s => {
    const card = document.createElement('div');
    card.className = 'script-card';
    card.dataset.name = s.name;
    card.innerHTML = `
      <div class="script-card-name">
        ${escapeHtml(s.name)}
        <span class="badge ${s.active ? 'active' : 'inactive'}">${s.active ? 'ativo' : 'inativo'}</span>
      </div>
      <div class="script-card-file">${escapeHtml(s.filename)}</div>
      ${s.description ? `<div class="script-card-desc">${escapeHtml(s.description)}</div>` : ''}
    `;
    card.addEventListener('click', () => selectScript(s, card));
    list.appendChild(card);
  });
}

function selectScript(script, card) {
  document.querySelectorAll('.script-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  selectedScript = script;

  const disp = document.getElementById('selectedScriptDisplay');
  disp.textContent = script.name;
  disp.className = 'script-name-display selected';

  document.getElementById('btnExecute').disabled = !script.active;
  if (!script.active) toast(`Script "${script.name}" está inativo e não pode ser executado.`, 'fail');
}

// ── Execução ─────────────────────────────────────────────────────────────────

async function executeScript() {
  if (!selectedScript) return;
  const params = parseParams(document.getElementById('paramsInput').value);
  const btn = document.getElementById('btnExecute');

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  clearOutput();

  try {
    const r = await fetch(`${API}/api/v1/execute/${encodeURIComponent(selectedScript.name)}`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ params }),
    });

    const data = await r.json();

    if (!r.ok) {
      showError(data.detail || `HTTP ${r.status}`);
      toast(data.detail || 'Erro na execução', 'fail');
      return;
    }

    showResult(data);
    toast(`Executado com sucesso (exit ${data.exit_code})`, data.exit_code === 0 ? 'ok' : 'fail');

    // Recarrega logs automaticamente se a aba estiver ativa
    if (document.getElementById('tab-logs').classList.contains('active')) loadLogs();
  } catch (e) {
    showError(e.message);
    toast(e.message, 'fail');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '&#9654; Executar';
  }
}

function clearOutput() {
  document.getElementById('resultMeta').style.display = 'none';
  document.getElementById('outputBox').innerHTML = '<span class="spinner"></span> executando…';
}

function showResult(data) {
  const ok = data.exit_code === 0;
  const meta = document.getElementById('resultMeta');
  meta.style.display = 'flex';
  meta.innerHTML = `
    <div class="meta-item ${ok ? 'ok' : 'fail'}"><strong>${data.status.toUpperCase()}</strong></div>
    <div class="meta-item">Exit <strong>${data.exit_code}</strong></div>
    <div class="meta-item">Log <strong>#${data.log_id}</strong></div>
    <div class="meta-item">Script <strong>${escapeHtml(data.script)}</strong></div>
    ${data.params_used && data.params_used.length ? `<div class="meta-item">Params <strong>${escapeHtml(data.params_used.join(' '))}</strong></div>` : ''}
    <div class="meta-item">Em <strong>${formatDate(data.executed_at)}</strong></div>
  `;

  const box = document.getElementById('outputBox');
  let content = '';
  if (data.stdout) content += `<span style="color:var(--text)">${escapeHtml(data.stdout)}</span>`;
  if (data.stderr) content += `\n<span style="color:var(--error)">[stderr]\n${escapeHtml(data.stderr)}</span>`;
  if (!content) content = `<span style="color:var(--muted)">(sem saída)</span>`;
  box.innerHTML = content;
}

function showError(msg) {
  document.getElementById('resultMeta').style.display = 'none';
  document.getElementById('outputBox').innerHTML =
    `<span style="color:var(--error)">Erro: ${escapeHtml(msg)}</span>`;
}

// ── Logs ──────────────────────────────────────────────────────────────────────

async function loadLogs() {
  const token = currentToken();
  if (!token) { toast('Informe o token primeiro.', 'fail'); return; }

  const scriptFilter = document.getElementById('logFilterScript').value.trim();
  const statusFilter = document.getElementById('logFilterStatus').value;

  const params = new URLSearchParams({ limit: 100 });
  if (scriptFilter) params.set('script_name', scriptFilter);
  if (statusFilter) params.set('status', statusFilter);

  const tbody = document.getElementById('logsBody');
  tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:24px"><span class="spinner"></span> Carregando…</td></tr>`;

  try {
    const r = await fetch(`${API}/api/v1/logs/?${params}`, { headers: headers() });
    if (!r.ok) {
      const err = await r.json().catch(() => ({ detail: r.statusText }));
      throw new Error(err.detail || r.statusText);
    }
    const logs = await r.json();
    renderLogs(logs);
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="7" style="color:var(--error);text-align:center;padding:24px">${escapeHtml(e.message)}</td></tr>`;
    toast(e.message, 'fail');
  }
}

function renderLogs(logs) {
  const tbody = document.getElementById('logsBody');
  if (!logs.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:32px">Nenhum log encontrado</td></tr>`;
    return;
  }

  tbody.innerHTML = '';
  logs.forEach(l => {
    const ok = l.status === 'success';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="color:var(--muted)">${l.id}</td>
      <td><strong>${escapeHtml(l.script_name)}</strong></td>
      <td><span class="badge ${ok ? 'active' : 'inactive'}">${escapeHtml(l.status)}</span></td>
      <td style="font-family:var(--mono);color:${ok ? 'var(--success)' : 'var(--error)'}">${l.exit_code ?? '—'}</td>
      <td style="color:var(--muted);font-family:var(--mono)">${escapeHtml(l.params_used || '—')}</td>
      <td class="log-stdout-preview" title="${escapeHtml((l.stdout || l.stderr || '').slice(0, 300))}">${escapeHtml((l.stdout || l.stderr || '').slice(0, 80)) || '<span style=\'color:var(--muted)\'>—</span>'}</td>
      <td style="color:var(--muted)">${formatDate(l.executed_at)}</td>
    `;
    tbody.appendChild(tr);
  });
}

// ── Tabs ──────────────────────────────────────────────────────────────────────

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
    if (tab.dataset.tab === 'logs') loadLogs();
  });
});

// ── Event listeners ───────────────────────────────────────────────────────────

document.getElementById('btnLoad').addEventListener('click', loadScripts);
document.getElementById('btnRefresh').addEventListener('click', loadScripts);
document.getElementById('btnExecute').addEventListener('click', executeScript);
document.getElementById('btnLoadLogs').addEventListener('click', loadLogs);

document.getElementById('tokenInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadScripts();
});

document.getElementById('paramsInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !document.getElementById('btnExecute').disabled) executeScript();
});

// ── Init ──────────────────────────────────────────────────────────────────────

checkApiStatus();
setInterval(checkApiStatus, 15000);
</script>
</body>
</html>
